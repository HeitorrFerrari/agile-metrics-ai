# Copie para board_config.yaml e ajuste ao quadro do seu time.
#
# A engine de métricas só entende estes tipos de coluna normalizados:
#   queue  -> item esperando, ninguém trabalhando nele  (conta como tempo de espera)
#   active -> item sendo trabalhado ativamente           (conta como tempo de toque)
#   done   -> item saiu do sistema
#
# `name` precisa bater exatamente com o nome da coluna / state do quadro no Azure DevOps.

name: "Time X - Quadro de Desenvolvimento"

columns:
  - name: "New"
    type: queue
    wip_limit: null
  - name: "Active"
    type: active
    wip_limit: 3
  - name: "Code Review"
    type: active
    wip_limit: 2
  - name: "Ready for Test"
    type: queue
    wip_limit: null
  - name: "Testing"
    type: active
    wip_limit: 2
  - name: "Closed"
    type: done
    wip_limit: null

# O cycle time é medido da primeira vez que um card entra em `start_column`
# até a primeira vez que ele entra em `done_column`.
start_column: "Active"
done_column: "Closed"

# Quantos dias de histórico puxar numa execução de análise completa.
history_days: 90
